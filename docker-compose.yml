version: '3.9'

services:
  backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - 8000:8000
    env_file:
      - .env.example
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:14.0-alpine
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=twitter_clone_api_dev_db
      - POSTGRES_USER=twitter_clone_api_dev
      - POSTGRES_PASSWORD=twitter_clone_api_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twitter_clone_api_dev -d twitter_clone_api_dev_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ========== NOVOS SERVIÇOS ==========
  
  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery_worker:
    build: .
    command: celery -A config worker -l info --pool=solo
    volumes:
      - .:/app
    env_file:
      - .env.example
    networks:
      - backend
    depends_on:
      - redis
      - db

  celery_beat:
    build: .
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file:
      - .env.example
    networks:
      - backend
    depends_on:
      - redis
      - db

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  app_data: